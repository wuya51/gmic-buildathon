<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A GM application built with Linera and React"
    />
    <title>Linera GM Demo</title>
    
    <style>
      @keyframes indeterminate {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }
      .animate-indeterminate {
        width: 60%;
        animation: indeterminate 1.8s ease-in-out infinite;
      }
      @keyframes dots {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
      .dots {
        animation: dots 1.2s ease-in-out infinite;
      }

      @keyframes rocket {
        0% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-10px) rotate(5deg); }
        50% { transform: translateY(-20px) rotate(0deg); }
        75% { transform: translateY(-10px) rotate(-5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
      
      .rocket-animation {
        animation: rocket 2s ease-in-out infinite;
      }

      #app-loading {
        opacity: 1;
        transform: scale(1);
        transition: none;
        
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        z-index: 9999 !important;
        background: linear-gradient(135deg, #f8f5ed, white, #f8f5ed) !important;
      }
      
      #app-loading.fade-out {
        opacity: 0;
        transform: scale(0.9);
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .rocket-animation,
      .animate-indeterminate,
      .dots,
      .animate-pulse {
        animation-play-state: running !important;
        will-change: transform, opacity;
        backface-visibility: hidden;
        transform: translateZ(0);
      }
      
      .animate-indeterminate {
        animation: indeterminate 1.8s ease-in-out infinite !important;
        animation-delay: 0s !important;
      }
      
      .rocket-animation {
        animation: rocket 2s ease-in-out infinite !important;
        animation-delay: 0s !important;
      }
      
      .dots {
        animation: dots 1.2s ease-in-out infinite !important;
        animation-delay: 0s !important;
      }
      
      .animate-pulse {
        animation: pulse 1.5s ease-in-out infinite !important;
        animation-delay: 0s !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="app-loading" class="fixed inset-0 bg-gradient-to-br from-[#f8f5ed] via-white to-[#f8f5ed] flex flex-col items-center justify-center z-50 gap-8 transition-all duration-800">
      <div class="text-8xl mb-6 rocket-animation">🚀</div>
      <h1 class="text-4xl font-bold bg-gradient-to-r from-orange-500 to-red-500 bg-clip-text text-transparent mb-2">
        GMIC Chat
      </h1>

      <div class="w-96 max-w-[90vw] bg-gray-200/80 rounded-full h-3 overflow-hidden shadow-inner">
        <div class="h-full bg-gradient-to-r from-orange-500 via-red-500 to-pink-500 rounded-full animate-indeterminate shadow-lg"></div>
      </div>
      <p class="text-xl font-semibold text-gray-700">
        Loading decentralized chat<span class="dots">...</span>
      </p>
      <p class="text-sm text-gray-500 mt-2">Powered by Linera Protocol</p>
      <div class="flex space-x-2 mt-4">
        <div class="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></div>
        <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
        <div class="w-2 h-2 bg-pink-500 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
      </div>


    </div>

    <script>
      window.hideLoadingOverlay = function() {
        const loadingOverlay = document.getElementById('app-loading');
        if (loadingOverlay) {
          loadingOverlay.classList.add('fade-out');
          setTimeout(() => {
            loadingOverlay.remove();
          }, 800);
        }
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
